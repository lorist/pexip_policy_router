{% extends "policy_router/base.html" %}
{% block title %}Advanced Logic Editor – {{ rule.name }}{% endblock %}

{% block content %}
<h2 class="mb-4">🧠 Advanced Logic for Rule: <strong>{{ rule.name }}</strong></h2>

<form method="post">
  {% csrf_token %}

  <!-- Participant Logic -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Participant Logic</strong>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="participant_enabled"
               name="participant_enabled" {% if participant_logic.enabled %}checked{% endif %}>
        <label class="form-check-label" for="participant_enabled">Enabled</label>
      </div>
    </div>
    <div class="card-body">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Conditions (JSON)</label>
          <textarea id="participant_conditions"
                    name="participant_conditions"
                    class="form-control json-textarea"
                    rows="12">{{ participant_logic.conditions|safe }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Response (JSON)</label>
          <textarea id="participant_response"
                    name="participant_response"
                    class="form-control json-textarea"
                    rows="12">{{ participant_logic.response|safe }}</textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Service Logic -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <strong>Service Logic</strong>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="service_enabled"
               name="service_enabled" {% if service_logic.enabled %}checked{% endif %}>
        <label class="form-check-label" for="service_enabled">Enabled</label>
      </div>
    </div>
    <div class="card-body">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Conditions (JSON)</label>
          <textarea id="service_conditions"
                    name="service_conditions"
                    class="form-control json-textarea"
                    rows="12">{{ service_logic.conditions|safe }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Response (JSON)</label>
          <textarea id="service_response"
                    name="service_response"
                    class="form-control json-textarea"
                    rows="12">{{ service_logic.response|safe }}</textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="text-end mt-4">
    <button type="submit" class="btn btn-primary btn-sm">💾 Save</button>
    <a href="{% url 'policy_router:rule_edit' rule.id %}" class="btn btn-secondary btn-sm">← Back to Rule</a>
  </div>
</form>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const theme = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "dracula" : "eclipse";

  document.querySelectorAll(".json-textarea").forEach(textarea => {
    try {
      const parsed = JSON.parse(textarea.value);
      textarea.value = JSON.stringify(parsed, null, 2);
    } catch {}

    if (window.CodeMirror) {
      const editor = CodeMirror.fromTextArea(textarea, {
        mode: { name: "javascript", json: true },
        lineNumbers: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        tabSize: 2,
        theme: theme,
      });
      editor.setSize("100%", "350px");
    }
  });
});
</script>
{% endblock %}
